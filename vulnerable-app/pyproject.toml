[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "vulnlab-vulnerable"
version = "0.1.0"
description = "Socle du laboratoire pédagogique local VulnLab"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "Flask==3.1.3",
    "gunicorn==26.2.0; sys_platform == 'linux'",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]
build = ["hatchling==1.32.4"]

[tool.uv]
required-version = "==0.12.19"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnlab_vulnerable"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
markers = [
    "functional: futurs tests fonctionnels (aucun en M2)",
    "vulnerable_behavior: futures démonstrations de faiblesse (aucune en M2)",
    "security: futurs tests de remédiation (aucun en M2)",
]
