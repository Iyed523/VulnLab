# M12 preparation only. No lab access, published port, volume or personal profile.
name: vulnlab-m12-1-browser-preflight
services:
  browser-preflight:
    image: vulnlab-m12-1-browser:1.63.0
    build:
      context: ./docker/browser
    init: true
    user: pwuser
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/browser/seccomp-chroot.json
    shm_size: 256m
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    restart: "no"
    tmpfs: ["/tmp:rw,nosuid,size=256m,mode=1777"]
